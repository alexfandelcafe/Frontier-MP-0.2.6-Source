<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FrontierMP</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", sans-serif;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }

    .panel {
      width: min(760px, calc(100vw - 80px));
      padding: 34px 40px;
      box-sizing: border-box;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 14px;
      background: rgba(13, 16, 20, 0.90);
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.48);
      backdrop-filter: blur(5px);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 34px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    p {
      margin: 0 0 12px;
      color: rgba(255, 255, 255, 0.78);
      line-height: 1.5;
    }

    .status {
      margin-top: 22px;
      padding: 12px 14px;
      border-left: 3px solid rgba(255, 255, 255, 0.62);
      background: rgba(255, 255, 255, 0.06);
      color: rgba(255, 255, 255, 0.90);
    }

    small {
      display: block;
      margin-top: 18px;
      color: rgba(255, 255, 255, 0.46);
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1>FrontierMP</h1>
    <p>Native RDR Title Screen 3D scene remains underneath this CEF frontend.</p>
    <p>The browser is rendered off-screen and composited into the game's D3D11 frame.</p>
    <div class="status">CEF OSR / D3D11 composition path active.</div>
    <small>cef/cef_ui/mainmenu/index.html</small>
  </main>
</body>
</html>
